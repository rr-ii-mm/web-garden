<script>
    let userCountry = '';

    function updateTime() {
        const now = new Date();
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[now.getMonth()];
        const day = now.getDate();
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const countryStr = userCountry ? `, ${userCountry}` : '';
        document.getElementById('datetime').textContent =
            `${month}. ${day}. ${year}. ${hours}:${minutes}${countryStr}`;
    }

    fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
            userCountry = data.country_name || '';
            updateTime();
        })
        .catch(() => {});

    updateTime();
    setInterval(updateTime, 60000);

    function updateHeaderSpace() {
        const header = document.getElementById('header');
        const space = document.getElementById('header-space');
        if (header && space) {
            space.style.height = header.offsetHeight + 'px';
        }
    }
    updateHeaderSpace();
    window.addEventListener('resize', updateHeaderSpace);

    function fitImagesToViewport() {
        const container = document.querySelector('p2');
        const imgs = Array.from(container.querySelectorAll('img'));

        if (window.innerWidth > 680) {
            imgs.forEach(img => img.style.height = '');
            return;
        }

        const headerH = (document.getElementById('header') || {}).offsetHeight || 0;
        const availW = window.innerWidth;
        const availH = window.innerHeight - headerH - 10;
        const gap = 2;
        const count = imgs.length;
        const heightPerWidth = 6 / 5;

        let bestH = null;
        for (let cols = 1; cols <= count; cols++) {
            const imgW = (availW - gap * (cols - 1)) / cols;
            const imgH = imgW * heightPerWidth;
            const rows = Math.ceil(count / cols);
            const totalH = rows * imgH + (rows - 1) * gap;
            if (totalH <= availH) {
                bestH = imgH;
                break;
            }
        }

        if (bestH !== null) {
            imgs.forEach(img => img.style.height = bestH + 'px');
        }
    }

    window.addEventListener('load', fitImagesToViewport);
    window.addEventListener('resize', fitImagesToViewport);
</script>
