<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>web garden
	</title>
	<meta name="description" content="설명">
	<meta name="keywords" content="키워드1, 키워드2">
	<meta property="og:image" content="">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="icon" type="image/png" href="">

</head>

<body>

<div id="header">
<span id="title">Welcome to <span class="title-line">Web Garden</span></span>

<div class="interaction">
<span id="share"><u>You can share<wbr><span style="white-space:nowrap"> your plants as well</span></u></span><br>
<input type="file" id="plant-upload" accept="image/*" multiple style="display:none">
</div>

<div class="secondary">
<span id="datetime"></span>
</div>

</div>
<div id="header-space"></div>

<div id="last-update">
Last update: May. 18. 2026<br>
<u><a href="https://www.instagram.com/h__erin/">@hyerimhong</a></u>
</div>

<div id="book">
	<div id="spread">
		<img id="left-img" src="">
		<img id="right-img" src="">
	</div>
</div>

<script>
    let userCountry = '';
    let weatherText = '';
    let tempText = '';

    function getWeatherLabel(code) {
        if (code === 0) return 'Sunny';
        if (code <= 3) return 'Cloudy';
        if (code <= 48) return 'Foggy';
        if (code <= 55) return 'Drizzle';
        if (code <= 65) return 'Rain';
        if (code <= 77) return 'Snow';
        if (code <= 82) return 'Shower';
        if (code <= 86) return 'Snow shower';
        return 'Storm';
    }

    function updateTime() {
        const now = new Date();
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const month = months[now.getMonth()];
        const day = now.getDate();
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const line1 = `${month}. ${day}. ${year}. ${hours}:${minutes}:${seconds}`;
        const parts = [];
        if (userCountry) parts.push(userCountry);
        if (weatherText) parts.push(weatherText);
        if (tempText) parts.push(tempText);
        const line2 = parts.join(', ');
        document.getElementById('datetime').innerHTML =
            line2 ? `${line1},<br>${line2}` : line1;
    }

    fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(data => {
            userCountry = data.country_name || '';
            updateTime();
            const lat = data.latitude, lon = data.longitude;
            if (lat && lon) {
                return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,temperature_2m`);
            }
        })
        .then(r => r && r.json())
        .then(data => {
            if (data && data.current != null) {
                weatherText = getWeatherLabel(data.current.weather_code);
                if (data.current.temperature_2m != null) {
                    tempText = data.current.temperature_2m + '°C';
                }
                updateTime();
            }
        })
        .catch(() => {});

    updateTime();
    setInterval(updateTime, 1000);

    document.addEventListener('error', function (e) {
        if (e.target.tagName === 'IMG' && !e.target.dataset.fallback) {
            e.target.dataset.fallback = '1';
            e.target.src = 'assets/img/planb-img.png';
        }
    }, true);

    document.getElementById('share').addEventListener('click', () => {
        document.getElementById('plant-upload').click();
    });

    document.getElementById('plant-upload').addEventListener('change', function () {
        Array.from(this.files).forEach(file => {
            images.push(URL.createObjectURL(file));
        });
        this.value = '';
    });

    function updateHeaderSpace() {
        const header = document.getElementById('header');
        const space = document.getElementById('header-space');
        if (header && space) {
            space.style.height = header.offsetHeight + 'px';
        }
        updateBookConstraints();
    }
    updateHeaderSpace();
    window.addEventListener('resize', updateHeaderSpace);

    // Book viewer
    const images = Array.from({length: 176}, (_, i) => `img${i + 1}.jpg`);

    function imgSrc(filename) {
        return (filename.startsWith('blob:') || filename.startsWith('data:'))
            ? filename
            : 'assets/img/' + filename;
    }

    function updateBookConstraints() {
        const header = document.getElementById('header');
        const headerH = header ? header.offsetHeight : 0;
        const bodyMarginTop = parseFloat(getComputedStyle(document.body).marginTop) || 16;
        const bodyMarginBottom = parseFloat(getComputedStyle(document.body).marginBottom) || 16;
        const bottomH = 100;
        const availH = window.innerHeight - bodyMarginTop - headerH - bodyMarginBottom - bottomH;
        const availW = Math.floor((window.innerWidth - bodyMarginTop * 2 - 4) / 2);
        document.documentElement.style.setProperty('--img-max-h', Math.max(80, availH) + 'px');
        document.documentElement.style.setProperty('--img-max-w', Math.max(80, availW) + 'px');
    }

    let currentSpread = 0;

    function showSpread(index) {
        const leftImg = document.getElementById('left-img');
        const rightImg = document.getElementById('right-img');
        leftImg.src = imgSrc(images[index]);
        if (index + 1 < images.length) {
            rightImg.src = imgSrc(images[index + 1]);
            rightImg.style.visibility = '';
        } else {
            rightImg.style.visibility = 'hidden';
        }
        currentSpread = index;
    }

    document.getElementById('left-img').addEventListener('click', (e) => {
        e.stopPropagation();
        const prev = currentSpread - 2;
        showSpread(prev < 0 ? (images.length % 2 === 0 ? images.length - 2 : images.length - 1) : prev);
    });

    document.getElementById('book').addEventListener('click', () => {
        const next = currentSpread + 2;
        showSpread(next >= images.length ? 0 : next);
    });

    window.addEventListener('resize', updateBookConstraints);
    updateBookConstraints();
    showSpread(0);

</script>

</body>
</html>
